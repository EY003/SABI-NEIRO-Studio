[package]
name = "visualizer-app"
version = "17.0.0"
edition = "2021"

[dependencies]
visualizer-core = { path = "../visualizer-core" }
eframe = "0.27"
egui = "0.27"
tray-icon = "0.11"
global-hotkey = "0.4"
serde = { version = "1", features = ["derive"] }
toml = "0.8"
image = "0.24"
crossbeam-channel = "0.5"
glow = "0.13"
arc-swap = "1.7"
egui_glow = "0.27"
rfd = "0.14"
dirs = "5.0"
serde_json = "1"
unicode-bidi = "0.3"

# Win32 calls for the overlay (z-order above desktop icons, cursor polling)
windows-sys = { version = "0.52", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Storage_FileSystem",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[build-dependencies]
winres = "0.1"

[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
opt-level = 3
